name: 00878 Monitor

on:
  schedule:
    - cron: '*/5 1-5 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -c "import requests,os; b=os.environ['TG_BOT_TOKEN']; u=os.environ['TG_USER_ID']; r=requests.post('https://api.telegram.org/bot'+b+'/sendMessage',json={'chat_id':u,'text':'00878 test from GitHub Actions'}); print(r.status_code, r.json())"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}